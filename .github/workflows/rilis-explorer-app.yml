# Rilis installer aplikasi Zevrigo Explorer untuk Windows (TSK-M69, RENCANA_T11).
# Jalan saat pencipta mem-push tag `explorer-app-v<versi>` (versi sama dengan app/src-tauri/tauri.conf.json), atau manual
# (workflow_dispatch: hanya artefak, tanpa rilis). Dibangun dari commit tag dengan app/src-tauri/Cargo.lock tetap (`--locked`),
# lalu membuat rilis DRAF berisi installer NSIS dan SHA256SUMS.txt; pencipta memeriksa draf lalu menerbitkannya. Tidak memakai
# crate repo inti, jadi repo inti tidak di-checkout. Tauri CLI versi tetap 2.12.2 (sama dengan wallet MOD-15) dari npm.
# Belum ditandatangani (sama dengan wallet).

name: Rilis aplikasi explorer

on:
  push:
    tags: ["explorer-app-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rilis-explorer-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Installer Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CI: "true"
      TAURI_CLI_VERSION: "2.12.2"
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versi tag sama dengan tauri.conf.json
        id: versi
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $versi = $conf.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "explorer-app-v$versi") {
            Write-Error "tag $env:GITHUB_REF_NAME tidak sama dengan explorer-app-v$versi (tauri.conf.json)"
            exit 1
          }
          "versi=$versi" >> $env:GITHUB_OUTPUT

      - name: Toolchain Rust (rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Node.js (hanya untuk Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Aplikasi rilis dan installer NSIS
        run: npx --yes "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build -- --locked

      - name: Nama tetap dan SHA-256
        id: berkas
        shell: pwsh
        run: |
          $versi = '${{ steps.versi.outputs.versi }}'
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'installer tidak ditemukan'; exit 1 }
          New-Item -ItemType Directory -Force -Path rilis | Out-Null
          $nama = "zevrigo-explorer-$versi-x64-setup.exe"
          Copy-Item $exe.FullName (Join-Path rilis $nama)
          $sha = (Get-FileHash -Algorithm SHA256 (Join-Path rilis $nama)).Hash.ToLower()
          "$sha  $nama" | Out-File -Encoding ascii -NoNewline rilis/SHA256SUMS.txt
          "nama=$nama" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Output "$sha  $nama"

      - name: Artefak
        uses: actions/upload-artifact@v4
        with:
          name: zevrigo-explorer-${{ steps.versi.outputs.versi }}-windows
          path: app/rilis/
          retention-days: 30
          if-no-files-found: error

      - name: Rilis draf
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $catatan = Get-Content rilis-catatan.md -Raw
          $catatan = $catatan.Replace('{{VERSI}}', '${{ steps.versi.outputs.versi }}')
          $catatan = $catatan.Replace('{{TAG}}', $env:GITHUB_REF_NAME)
          $catatan = $catatan.Replace('{{COMMIT}}', $env:GITHUB_SHA.Substring(0, 7))
          $catatan = $catatan.Replace('{{BERKAS}}', '${{ steps.berkas.outputs.nama }}')
          $catatan = $catatan.Replace('{{SHA256}}', '${{ steps.berkas.outputs.sha }}')
          $catatan | Out-File -Encoding utf8 rilis/catatan.md
          gh release create $env:GITHUB_REF_NAME --draft --prerelease --verify-tag `
            --title "Zevrigo Explorer ${{ steps.versi.outputs.versi }} (aplikasi, demo regtest)" `
            --notes-file rilis/catatan.md `
            "rilis/${{ steps.berkas.outputs.nama }}" rilis/SHA256SUMS.txt
